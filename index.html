<!doctype html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Sandoval Francisco" />
    <title>Ejercicio 4 - Reloj Digital</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body
    class="bg-dark text-white min-vh-100 d-flex align-items-center justify-content-center p-3"
  >
    <main class="card contenedor-reloj shadow-lg border-0 text-center">
      <header class="seccion-fecha p-3 border-bottom border-dark-subtle">
        <p id="fecha" class="m-0 text-uppercase">Cargando fecha...</p>
      </header>

      <section
        class="seccion-hora p-3 p-md-4 p-lg-5 d-flex align-items-center justify-content-center gap-2"
      >
        <div class="bloque-principal d-flex align-items-center">
          <span id="horas">00</span>
          <span class="separador mx-1">:</span>
          <span id="minutos">00</span>
          <span class="separador mx-1">:</span>
        </div>

        <div
          class="bloque-secundario d-flex flex-column align-items-center justify-content-between"
        >
          <span id="ampm" class="fw-bold">AM</span>
          <span id="segundos">00</span>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
